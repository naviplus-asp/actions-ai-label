name: 'AI Label Management'
description: 'PR本文の「使用した生成AI」チェックに応じてラベルを付与/削除する'
branding:
  icon: 'tag'
  color: 'purple'

inputs:
  ai_tools:
    description: 'AIツール名のリスト（JSON配列文字列）'
    required: false
    default: '["GitHub Copilot","Cursor","Devin","Claude Code","Codex","Kiro"]'
  section_heading:
    description: 'PR本文でチェック欄を探す見出し（このセクションが無いPRではラベル操作をスキップする）'
    required: false
    default: '## 使用した生成AI'
  label_color:
    description: '作成するラベルの色（6桁16進、#なし）'
    required: false
    default: '7B68EE'
  label_description:
    description: '作成するラベルの説明'
    required: false
    default: '生成AIツール'
  enable_coauthor_email_detection:
    description: 'PRコミットのCo-Authored-ByメールアドレスからAIツール利用を判定するかどうか'
    required: false
    default: 'false'
  ai_tool_emails:
    description: 'Co-Authored-Byメールアドレスとラベル名の対応表（JSONオブジェクト文字列）'
    required: false
    default: '{"GitHub Copilot":["copilot@github.com","copilot[bot]@users.noreply.github.com","175728472@users.noreply.github.com","198982749@users.noreply.github.com"],"Cursor":["cursoragent@cursor.com"],"Devin":["devin-ai-integration[bot]@users.noreply.github.com","158243242@users.noreply.github.com","devin@devin.ai"],"Claude Code":["claude@anthropic.com","claude-code@anthropic.com","noreply@anthropic.com","claude@example.com","claude[bot]@users.noreply.github.com","209825114@users.noreply.github.com"],"Codex":["noreply@openai.com"]}'

runs:
  using: 'composite'
  steps:
    - name: Manage AI labels
      uses: actions/github-script@v8
      env:
        AI_TOOLS_JSON: ${{ inputs.ai_tools }}
        SECTION_HEADING: ${{ inputs.section_heading }}
        LABEL_COLOR: ${{ inputs.label_color }}
        LABEL_DESCRIPTION: ${{ inputs.label_description }}
        ENABLE_COAUTHOR_EMAIL_DETECTION: ${{ inputs.enable_coauthor_email_detection }}
        AI_TOOL_EMAILS_JSON: ${{ inputs.ai_tool_emails }}
      with:
        script: |
          const { default: run } = await import('${{ github.action_path }}/src/main.ts');
          await run({ github, context, core });
